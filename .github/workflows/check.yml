name: 本地交付检查
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm build:docs && pnpm build:preview
      - run: pnpm pack:local && pnpm prepare:consumer
      - run: pnpm --dir examples/vite-consumer install --ignore-workspace --no-frozen-lockfile
      - run: pnpm --dir examples/next-consumer install --ignore-workspace --no-frozen-lockfile
      - run: pnpm --dir examples/vite-consumer build && pnpm --dir examples/next-consumer build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - run: pnpm test:cross-browser
      - run: pnpm check:size
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-evidence
          path: |
            artifacts/
            test-results/
