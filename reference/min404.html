<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACCESS DENIED</title><style>@import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap);*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:#faf7f7;color:#3a3234;font:14px Inter,"Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif}main{width:100%;max-width:420px;text-align:center}svg{width:120px;height:120px;color:#b98b90;overflow:visible}.ring{transform-origin:100px 100px;animation:spin 14s linear infinite}.inner{animation-direction:reverse;animation-duration:7s}.mark{stroke-dasharray:392;stroke-dashoffset:392;animation:draw 1.15s cubic-bezier(.45,0,.2,1) .15s forwards}.bar{stroke-dasharray:84;stroke-dashoffset:84;animation:draw .65s cubic-bezier(.45,0,.2,1) .95s forwards}h1{margin:24px 0 32px;font-size:clamp(11px,1.6vh,13px);letter-spacing:6px;font-weight:600;text-indent:6px}dl{margin:0;padding-top:8px;border-top:1px solid #e9dfe0;text-align:left}dt{margin-top:16px;color:#8b7f80;font-size:12px}dd{margin:5px 0 0;font-family:"JetBrains Mono",monospace;overflow-wrap:anywhere;line-height:1.6}@keyframes spin{to{transform:rotate(360deg)}}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.ring,.mark{animation:none}.mark{stroke-dashoffset:0}}</style><body><main><svg viewBox="0 0 200 200" fill="none" stroke="currentColor" aria-hidden="true"><circle class="ring" cx="100" cy="100" r="92" stroke-dasharray="3 9" opacity=".4"/><circle class="ring inner" cx="100" cy="100" r="82" stroke-dasharray="120 395" opacity=".6"/><path class="mark" d="M100 38 164 148H36Z" stroke-width="2" stroke-linejoin="round"/><path class="mark bar" d="M60 112h80" stroke-width="2"/></svg><h1>ACCESS DENIED</h1><dl><dt>REQUEST ID</dt><dd id="requestId">{{REQUEST_ID}}</dd><dt>RULE ID</dt><dd id="ruleId">{{RULE_ID}}</dd></dl></main></body></html>
